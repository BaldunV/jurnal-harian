<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luring (Offline) — Jurnal</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F8FAFC;
            color: #0F172A;
            padding: 24px;
        }
        .card {
            max-width: 380px;
            width: 100%;
            text-align: center;
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 24px;
            padding: 40px 28px;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.06);
        }
        .badge {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 20px;
            background: #ECFDF5;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .badge svg { width: 36px; height: 36px; color: #10B981; }
        h1 { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
        p { font-size: 13px; color: #64748B; line-height: 1.6; margin-bottom: 24px; }
        button {
            width: 100%;
            padding: 13px 20px;
            border: none;
            border-radius: 14px;
            background: #10B981;
            color: #FFFFFF;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: #059669; }
        button:focus-visible { outline: 2px solid #10B981; outline-offset: 2px; }
    </style>
</head>
<body>
    <div class="card" role="alert">
        <div class="badge" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 17h-1.5a7.5 7.5 0 1 1 0-15h.5" />
                <path d="M6.5 17H5a7.5 7.5 0 1 0 0 15h.5" />
                <path d="M8 19.5 11.5 16 8 12.5" />
            </svg>
        </div>
        <h1>Kamu Sedang Luring</h1>
        <p>Koneksi internet terputus dan halaman ini belum tersimpan di perangkat. Halaman yang sudah pernah dibuka (mis. Dashboard &amp; Riwayat) tetap bisa diakses offline. Periksa koneksi lalu coba lagi.</p>
        <button onclick="location.reload()">Coba Lagi</button>
    </div>
</body>
</html>
