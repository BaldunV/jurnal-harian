name: jurnal_siswa
description: Jurnal tujuh kebiasaan siswa SMK BPPI.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  dio: ^5.11.0
  fl_chart: ^0.69.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.2
  riverpod: 3.4.2
  flutter_secure_storage: ^11.0.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  lucide_flutter: ^1.33.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/fonts/PlusJakartaSans-Variable.ttf
    - assets/fonts/Baloo2-Variable.ttf
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Variable.ttf
